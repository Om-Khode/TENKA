<!doctype html>
<!--
  form_oversized.html — 250 fields, to make the token budget actually fire.

  `_apply_token_budget` drops bounds, then placeholders, then invisible
  elements, then tail-prunes. None of that runs on a form that fits, so a
  fixture that fits proves nothing: the truncation path would be dead code with
  a green test beside it.

  250 is comfortably past the 4000-token default. If the budget or the
  serialisation ever gets much cheaper, raise this number rather than deleting
  the assertion -- `tree.truncated > 0` is the whole point of the file.

  Generated by a loop in the commit that added it; edit that loop, not this
  markup.
-->
