[tool.pytest.ini_options]
# Live-automation tests drive the real desktop: they open applications, click,
# type, and launch browsers. A bare `pytest tests/` used to collect them, which
# on 2026-08-08 typed into the machine's foreground window while someone was
# working. They are excluded by default and must be asked for by name:
#
#   py -3.11 -m pytest -m live_automation tests/test_computer_task_integration.py
#
# Run those only on a machine nobody is using.
addopts = "-m 'not live_automation'"
markers = [
    "live_automation: drives the real desktop or launches a real browser. Never collected by default.",
]

[tool.importlinter]
root_packages = ["assistant"]

[[tool.importlinter.contracts]]
name = "IO never imports actions"
type = "forbidden"
source_modules = ["assistant.io"]
forbidden_modules = ["assistant.actions"]

[[tool.importlinter.contracts]]
name = "IO never imports main"
type = "forbidden"
source_modules = ["assistant.io"]
forbidden_modules = ["assistant.main"]

[[tool.importlinter.contracts]]
name = "Config never imports storage"
type = "forbidden"
source_modules = ["assistant.config"]
forbidden_modules = ["assistant.storage"]
# One transitive path remains, and it is the last one: `config.py` itself never
# imports storage, but it reads `core/runtime_config`, which lazily reaches the
# settings repo so a stored setting can override an env default.
#
# The list here was sixteen entries. Fifteen of them existed because `config`
# eagerly evaluated `LLM_SYSTEM_PROMPT = _get_llm_system_prompt()` at module
# scope, which pulled in `llm/prompts.py` and, behind it, every domain facade
# that touches SQLite. Nothing in `assistant/` called that re-export or its two
# siblings, so they were deleted and fifteen exemptions went with them.
#
# Root cause of the remaining two, tracked: relocate `core/runtime_config.py`
# out of `core/`. Not done here, and not because it is hard -- because
# `io/api/` reads it too, and `io.api` is forbidden from reaching past
# `core`+`config`. Moving it to a domain module converts two `config -> storage`
# exemptions into a transitive `io.api -> storage` violation, which is a worse
# trade. The honest fix is `io/api` receiving its settings by injection like
# everything else it uses, which is Brain-boundary work (P4), not layering work.
ignore_imports = [
    "assistant.core.runtime_config -> assistant.storage.db",
    "assistant.core.runtime_config -> assistant.storage.repos.settings",
]

# ─── brain/ ─────────────────────────────────────────────────────────────────
# The tenth subpackage, approved 2026-08-23. It sits between `actions/` and
# `main.py`: it may reach everything below it and nothing beside or above it.
#
# `io ↛ brain` is the one that needs saying out loud. `io.api` already may not
# reach past `core`+`config`, so it takes the Brain the way it already takes
# the pipeline -- through the `ChatDispatch` protocol in `actions/`, injected by
# `main.py`. A direct import would re-litigate a boundary that was argued once.

[[tool.importlinter.contracts]]
name = "Brain never imports io directly"
type = "forbidden"
source_modules = ["assistant.brain"]
forbidden_modules = ["assistant.io"]
# Direct edges only. `brain -> actions` is legal and `actions -> io.audio.tts`
# is legal (the deferred-import convention), so the transitive chain exists by
# construction and forbidding it would forbid `brain -> actions` by proxy. What
# this contract is for is the direct reach: the Brain must never pick up a
# transport, a speaker or a socket itself. The indirect path is `actions`'
# business, governed by its own contracts.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Brain never imports main"
type = "forbidden"
source_modules = ["assistant.brain"]
forbidden_modules = ["assistant.main"]

[[tool.importlinter.contracts]]
name = "IO never imports brain"
type = "forbidden"
source_modules = ["assistant.io"]
forbidden_modules = ["assistant.brain"]

# ─── automation/ ────────────────────────────────────────────────────────────
# P4b. `automation/` is a *source* of turns, not an orchestrator of them, and
# `automation/event_bus.py` was the single place in the package reaching forward
# into `actions/` -- for `execute`, and for the three local-authority constants
# that live there. That was §8.3's fourth layer inversion. Both now come from
# `brain/turn.py:run_local_intent`, which is allowed to reach `actions/` and is
# where the coordination boundary belongs.
#
# Asserted rather than argued, because the previous state of this boundary was a
# comment. Measured before writing: exactly one wrong-way import existed, and it
# is gone.
[[tool.importlinter.contracts]]
name = "Automation never imports actions"
type = "forbidden"
source_modules = ["assistant.automation"]
forbidden_modules = ["assistant.actions"]
# Direct edges only, for the same reason `brain ↛ io` uses it: `automation`
# legitimately imports `verification`, which imports `brain.task`, which may
# import `actions` -- forbidding the transitive chain would forbid edges nobody
# objects to. What this closes is the direct reach: a source of turns must not
# dispatch one itself.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Overlay never imports actions or automation"
type = "forbidden"
source_modules = ["assistant.io.overlay"]
forbidden_modules = ["assistant.actions", "assistant.automation"]

[[tool.importlinter.contracts]]
name = "io.api never reaches past core and config"
type = "forbidden"
source_modules = ["assistant.io.api"]
forbidden_modules = [
    "assistant.storage",
    "assistant.actions",
    "assistant.automation",
    "assistant.llm",
    "assistant.main",
]
